name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify CLI and plugin release metadata
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          plugin_version="$(python3 -c 'import json; print(json.load(open("plugins/launchctl/.codex-plugin/plugin.json"))["version"])')"
          if [[ "$plugin_version" != "$release_version" ]]; then
            echo "plugin version $plugin_version does not match release $release_version" >&2
            exit 1
          fi

      - name: Test distribution
        run: |
          go test -race ./...
          go vet ./...
          go build ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CONTABO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CONTABO_SECRET_KEY }}
