version: 2

project_name: lctl

builds:
  - binary: lctl
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/kkz6/launchctl/cmd.Version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

blobs:
  - provider: s3
    endpoint: "https://sin1.contabostorage.com"
    bucket: launchctl-cli
    region: sin1
    directory: "{{ .Tag }}"
    disable_ssl: false

homebrew_casks:
  - name: lctl
    binaries:
      - lctl
    homepage: "https://launchctl.io"
    description: "CLI for managing launchctl servers, sites, and deployments"
    directory: Casks
    url:
      template: "https://sin1.contabostorage.com/2fac7399ecc245c4b352abf9eb154e1d:launchctl-cli/{{ .Tag }}/{{ .ArtifactName }}"
    repository:
      owner: kkz6
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_msg_template: "update lctl to {{ .Tag }}"
    commit_author:
      name: kkz6
      email: kkz6@users.noreply.github.com

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
    - title: Bug Fixes
      regexp: '^fix'
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: kkz6
    name: launchctl-cli
  name_template: "v{{ .Version }}"
